<!DOCTYPE html>
<!-- Template: the build script (build.mjs) fills the {{...}} parts from the files in content/. Edit text in the admin (/admin/) or in content/, not here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home2">
  <!-- Home #2 (alona's design, 2026-11-06). Home #1 is kept at /home-1/. -->
  <header class="h2-header" id="home">
    <nav class="h2-nav">
      <a href="#works">Works</a>
      <a href="abimal/">Exhibited</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <!-- Hero: one scroll changes the photo; captions sit left and right of it -->
  <div class="hero-scroll h2-hero" style="--slides:{{hero.count}}">
    <p class="h2-cap h2-cap-left">
{{{hero.left}}}
    </p>
    <figure class="hero-frame">
{{{hero.images}}}
    </figure>
    <p class="h2-cap h2-cap-right">
{{{hero.right}}}
    </p>
  </div>

  <div class="h2-credits">
    <p class="h2-signature">Hamza Shah Mian<br>@2027</p>
    <p class="h2-studio"><img src="images/vilna-logo.svg" alt="Vilna" width="90" height="63"><span>digital art direction</span></p>
  </div>

  <main>
    <section id="works" class="h2-works">
      <h2 class="visually-hidden">Works</h2>
{{{home2.works}}}
    </section>


    <section id="about" class="about">
      <h2 class="about-label">About</h2>
      <figure class="about-photo">
        <img src="{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
      </figure>
      <p class="about-caption">{{{about.caption}}}</p>
      <div class="about-text">
        <blockquote>
          {{about.quote}}
        </blockquote>
        <div class="bio">
{{{about.bio}}}
        </div>
      </div>
    </section>
  </main>

  <script>
  // Hero slideshow: while the page is at the top, each scroll (wheel, swipe or
  // arrow key) fades to the next photo and caption. After the last photo the
  // page scrolls on as normal; scrolling back up at the top steps back.
  (function () {
    var wrap = document.querySelector('.hero-scroll');
    if (!wrap) return;
    var imgs = wrap.querySelectorAll('.hero-frame img');
    var caps = wrap.querySelectorAll('[data-slide]');
    var n = imgs.length;
    if (n < 2) return;
    var root = document.documentElement;
    root.classList.add('hero-js');
    var idx = 0, lockedAt = 0, lastEvent = 0;
    var FADE = 900;

    function show(k) {
      idx = k;
      for (var i = 0; i < n; i++) {
        // Photos up to the current one stay visible underneath, so a fade
        // always goes photo-to-photo, never through white.
        imgs[i].style.opacity = i <= idx ? 1 : 0;
        imgs[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
      }
      // Both captions (left and right of the photo) follow the photo.
      for (var c = 0; c < caps.length; c++) {
        var on = Number(caps[c].getAttribute('data-slide')) === idx;
        caps[c].classList.toggle('is-active', on);
        caps[c].setAttribute('aria-hidden', on ? 'false' : 'true');
      }
    }
    function atTop() { return window.scrollY <= 2; }
    function canStep(dir) { return atTop() && (dir > 0 ? idx < n - 1 : idx > 0); }
    // Returns true when the event was used to change the photo (or swallowed
    // while a change is still running).
    function step(dir) {
      var now = Date.now();
      lastEvent = now;
      // Hold the page still until the current gesture has ended, so one
      // trackpad swipe moves one photo and doesn't run on into the page.
      // Hold the page still while a fade runs. After that the next scroll
      // event moves on, even if the trackpad is still sending the same
      // swipe, so a long swipe can never get stuck on one photo.
      if (atTop() && now - lockedAt < FADE) return true;
      if (!canStep(dir)) return false;
      lockedAt = now;
      show(idx + dir);
      return true;
    }

    window.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) < 2) return;
      if (step(e.deltaY > 0 ? 1 : -1)) e.preventDefault();
    }, { passive: false });

    var startY = null, swiped = false;
    window.addEventListener('touchstart', function (e) {
      startY = e.touches[0].clientY; swiped = false;
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      var dy = startY - e.touches[0].clientY;
      var dir = dy > 0 ? 1 : -1;
      if (!canStep(dir)) return;
      e.preventDefault();
      if (!swiped && Math.abs(dy) > 30) { swiped = true; lastEvent = 0; step(dir); }
    }, { passive: false });
    window.addEventListener('touchend', function () { startY = null; }, { passive: true });

    window.addEventListener('keydown', function (e) {
      var dir = { ArrowDown: 1, PageDown: 1, ' ': 1, ArrowUp: -1, PageUp: -1 }[e.key];
      if (!dir || e.target.closest('input, textarea, select, button, a')) return;
      lastEvent = 0;
      if (step(dir)) e.preventDefault();
    });

    show(0);
  })();
  </script>
</body>
</html>
