  <!-- About, Works, Exhibited: the Vilna logo in the fixed credits shows up
       once you scroll to the very end of the page (alona 2026-11-16). -->
  <script>
  (function () {
    var root = document.documentElement;
    root.classList.add('vilna-on');
    function check() {
      var end = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
      root.classList.toggle('vilna-end', end);
    }
    window.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check);
    window.addEventListener('load', check);
    check();
  })();
  </script>
