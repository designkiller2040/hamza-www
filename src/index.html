<!DOCTYPE html>
<!-- Template: the build script (build.mjs) fills the {{...}} parts from the files in content/. Edit text in the admin (/admin/) or in content/, not here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home2">
  <!-- Home #2 (alona's design, 2026-11-06). Home #1 is kept at /home-1/. -->
  <header class="h2-header" id="home">
    <nav class="h2-nav">
      <a href="#works">Works</a>
      <a href="abimal/">Exhibited</a>
      <a href="about/">About</a>
    </nav>
  </header>

  <!-- Exhibitions, one after another, captions left and right of each photo -->
  <div class="h2-exhibitions">
{{{home2.exhibitions}}}
  </div>

  <div class="h2-credits">
    <p class="h2-signature">Hamza Shah Mian<br>@2027</p>
    <p class="h2-studio"><img src="images/vilna-logo.svg" alt="Vilna" width="90" height="63"><span>digital art direction</span></p>
  </div>

  <main>
    <section id="works" class="h2-works">
      <h2 class="visually-hidden">Works</h2>
{{{home2.works}}}
    </section>


    <section id="about" class="about">
      <h2 class="about-label">About</h2>
      <figure class="about-photo">
        <img src="{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
      </figure>
      <p class="about-caption">{{{about.caption}}}</p>
      <div class="about-text">
        <blockquote>
          {{about.quote}}
        </blockquote>
        <div class="bio">
{{{about.bio}}}
        </div>
      </div>
    </section>
  </main>

</body>
</html>
