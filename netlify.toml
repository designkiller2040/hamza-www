# Netlify settings. The site is built from content/ by build.mjs on every
# push to main, and the admin's sign-in helper lives in netlify/functions.
[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Keep the admin out of search engines and always fresh.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
