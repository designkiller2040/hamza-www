<!DOCTYPE html>
<!-- Template: the "fun" page, built to /lens/. A sharp photo under a blurred,
     grainy copy; a soft round hole in the blurred copy follows the cursor.
     Tweak the lens size with --r and its soft edge with --feather below. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Look closer — {{name}}</title>
  <meta name="description" content="Look closer: an installation by {{name}}.">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
  <style>
    .lens-page {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    .lens-hero {
      --r: 100px;       /* lens radius */
      --r-big: 140px;   /* lens radius over a hotspot (the stone) */
      --feather: 30px;  /* soft edge of the lens */
      --x: 50%;
      --y: 50%;
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .lens-hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    /* The blurred photo shows first; the sharp one stays hidden until the
       blurred one is on screen (script below). */
    .lens-bottom { visibility: hidden; }
    .lens-hero.ready .lens-bottom { visibility: visible; }
    .lens-top {
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        transparent 0, transparent calc(var(--r) - var(--feather)), #000 var(--r), #000 100%);
      mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        transparent 0, transparent calc(var(--r) - var(--feather)), #000 var(--r), #000 100%);
    }
    /* Small note that appears next to the lens over a hotspot */
    .lens-note {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 5;
      margin: 0;
      color: #fff;
      font-family: var(--garamond);
      font-size: 14px;
      line-height: 1.2;
      white-space: pre; /* keeps alona's line breaks */
      mix-blend-mode: difference;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .lens-note.on { opacity: 1; }

    /* Day / night switch: alona's two icons, 40 x 40, top centre
       (where she circled it, 2026-11-14) */
    .lens-modes {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      display: flex;
      gap: 12px;
    }
    .lens-modes button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    .lens-modes button[aria-pressed="true"],
    .lens-modes button:hover { opacity: 1; }
    .lens-modes img { display: block; width: 100%; height: 100%; }
    @media (max-width: 575.98px) {
      .lens-modes { top: 32px; }
      .lens-modes button { width: 28px; height: 28px; }
    }
  </style>
</head>
<body class="home2 lens-page">
  <div class="lens-hero" id="lens">
    <img class="lens-bottom" data-src="{{root}}images/lens/sharp.jpg" alt="What We Venerate: piles of earth in an old hall, a blue stone hanging from chains" width="2263" height="1049">
    <img class="lens-top" src="{{root}}images/lens/blur.jpg" alt="" aria-hidden="true" fetchpriority="high" width="2263" height="1049">
  </div>

  <p class="lens-note" aria-live="polite"></p>

  <div class="lens-modes" role="group" aria-label="Day or night">
    <button type="button" data-mode="day" aria-pressed="true"><img src="{{root}}images/lens/day.png" alt="Day" width="40" height="40"></button>
    <button type="button" data-mode="night" aria-pressed="false"><img src="{{root}}images/lens/night.png" alt="Night" width="40" height="40"></button>
  </div>

  <div class="h2-credits">
    <p class="h2-signature">Hamza Shah Mian @2027</p>
    <p class="h2-studio"><a class="h2-studio-link" href="https://www.instagram.com/chesskiller2040/" target="_blank" rel="noopener"><img src="{{root}}images/vilna-logo.svg" alt="Vilna" width="90" height="63"><span>web art direction</span></a></p>
    <p class="h2-fun"><a href="{{root}}">Back</a></p>
  </div>

  <script>
  // Day / night: swap both photos (sharp underneath, blurred on top).
  (function () {
    var root = '{{root}}images/lens/';
    var modes = {
      day: { sharp: root + 'sharp.jpg', blur: root + 'blur.jpg',
        alt: 'What We Venerate: piles of earth in an old hall, a blue stone hanging from chains' },
      night: { sharp: root + 'night-sharp.jpg', blur: root + 'night-blur.jpg',
        alt: 'What We Venerate at night: the hall lit by candles, a figure reaching up to the hanging stone' }
    };
    var bottom = document.querySelector('.lens-bottom');
    var top = document.querySelector('.lens-top');
    var buttons = document.querySelectorAll('.lens-modes button');
    var hero = document.getElementById('lens');
    // Blurred first: only once it has loaded do we fetch and show the sharp
    // one, then load the night photos so switching is instant.
    function start() {
      bottom.src = bottom.dataset.src;
      hero.classList.add('ready');
      [modes.night.blur, modes.night.sharp].forEach(function (u) { new Image().src = u; });
    }
    if (top.complete && top.naturalWidth) start();
    else { top.addEventListener('load', start, { once: true }); top.addEventListener('error', start, { once: true }); }
    function setMode(name) {
      var m = modes[name];
      top.src = m.blur;
      bottom.src = m.sharp; bottom.alt = m.alt;
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === name)); });
    }
    buttons.forEach(function (b) {
      b.addEventListener('click', function () { setMode(b.dataset.mode); });
    });
  })();

  (function () {
    var hero = document.getElementById('lens');
    var style = getComputedStyle(hero);
    var R = parseFloat(style.getPropertyValue('--r')) || 100;        // open size, from CSS
    var R_BIG = parseFloat(style.getPropertyValue('--r-big')) || 140; // over a hotspot
    var note = document.querySelector('.lens-note');
    var shownText = '';

    // Hotspots, in pixels of the photo (2263 x 1049; the night photo is
    // framed the same). x, y = centre, size = how close counts as "on it".
    // Add more parts here: { x, y, size, text } for a round spot
    // (add side: 'left' to put the note left of the lens),
    // or { box: [left, top, right, bottom], text } for a whole object.
    var IMG_W = 2263, IMG_H = 1049;
    var PILES = 'Piles of coffee and tea as\na tribute to his mother\u2019s morning rituals';
    var HOTSPOTS = [
      { x: 1142, y: 452, size: 110, text: 'inherited stone lapis lazuli' },
      // Every coffee pile shows the same note.
      { box: [300, 780, 820, 970], text: PILES },
      { box: [620, 680, 960, 870], text: PILES },
      { box: [870, 740, 1050, 850], text: PILES },
      { box: [1020, 730, 1320, 845], text: PILES },
      { box: [1360, 745, 1540, 840], text: PILES },
      { box: [1390, 760, 1770, 880], text: PILES },
      // The rust painting on the right wall: anywhere on it counts (box = left, top, right, bottom).
      { box: [1805, 295, 1928, 880], side: 'left', text: 'Artwork "Name" 2024' }
    ];
    // Photo pixels -> screen pixels (the photo covers the screen).
    function hit(px, py) {
      var w = hero.clientWidth, h = hero.clientHeight;
      var k = Math.max(w / IMG_W, h / IMG_H);
      var ox = (w - IMG_W * k) / 2, oy = (h - IMG_H * k) / 2;
      for (var i = 0; i < HOTSPOTS.length; i++) {
        var s = HOTSPOTS[i];
        if (s.box) {
          if (px > ox + s.box[0] * k && px < ox + s.box[2] * k &&
              py > oy + s.box[1] * k && py < oy + s.box[3] * k) return s;
          continue;
        }
        var dx = px - (ox + s.x * k), dy = py - (oy + s.y * k);
        if (dx * dx + dy * dy < Math.pow(Math.max(s.size * k, 50), 2)) return s;
      }
      return null;
    }
    var EASE = 0.15;

    var tx = hero.clientWidth / 2, ty = hero.clientHeight / 2; // target
    var x = tx, y = ty;                                         // drawn
    var tr = 0, r = 0;                                          // target / drawn radius
    var lastInput = 0, idle = true, t0 = performance.now();
    var IDLE_AFTER = 2500; // ms without input before the drift starts

    function setTarget(e) {
      var b = hero.getBoundingClientRect();
      tx = e.clientX - b.left;
      ty = e.clientY - b.top;
      lastInput = performance.now();
      idle = false;
    }

    // Mouse / pen: lens follows while the pointer is over the hero.
    hero.addEventListener('pointerenter', function (e) {
      if (e.pointerType === 'touch') return;
      setTarget(e);
      if (r < 1) { x = tx; y = ty; } // open where the cursor is, not glide in
      tr = R;
    });
    hero.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch' && !e.buttons && e.pressure === 0) return;
      setTarget(e);
      tr = R;
    });
    hero.addEventListener('pointerleave', function (e) {
      if (e.pointerType === 'touch') return;
      lastInput = performance.now();
      tr = 0;
    });

    // Touch: follow the finger while dragging, close on release.
    hero.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch') return;
      setTarget(e);
      x = tx; y = ty;
      tr = R;
    });
    function release(e) {
      if (e.pointerType !== 'touch') return;
      lastInput = performance.now();
      tr = 0;
    }
    hero.addEventListener('pointerup', release);
    hero.addEventListener('pointercancel', release);

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame(now) {
      // Idle drift: with no input for a while, the lens wanders slowly.
      var spot;
      if (!reduce && tr === 0 && now - lastInput > IDLE_AFTER) {
        if (!idle) { idle = true; t0 = now; }
        var w = hero.clientWidth, h = hero.clientHeight, t = (now - t0) / 1000;
        tx = w / 2 + Math.sin(t * 0.23) * w * 0.32;
        ty = h / 2 + Math.sin(t * 0.31 + 1) * h * 0.25;
        if (r < 1) { x = tx; y = ty; }
        r += (R - r) * 0.03;
        spot = null;
      } else {
        // Over a hotspot the lens opens wider and its note appears.
        var spot = tr > 0 ? hit(tx, ty) : null;
        r += ((spot ? R_BIG : tr) - r) * EASE;
      }
      var text = spot ? spot.text : '';
      if (text !== shownText) {
        shownText = text;
        if (text) note.textContent = text;
        note.classList.toggle('on', !!text);
      }
      if (shownText) {
        // Just outside the lens, to its upper right.
        // Flips to the upper left when it would run off the right edge.
        var nw = note.offsetWidth, nh = note.offsetHeight;
        var nx = x + r * 0.72 + 12;
        if ((spot && spot.side === 'left') || nx + nw > innerWidth - 16) nx = x - r * 0.72 - 12 - nw;
        var ny = Math.max(16, y - r * 0.72 - nh);
        note.style.transform = 'translate(' + nx.toFixed(1) + 'px,' + ny.toFixed(1) + 'px)';
      }
      x += (tx - x) * EASE;
      y += (ty - y) * EASE;
      hero.style.setProperty('--x', x.toFixed(1) + 'px');
      hero.style.setProperty('--y', y.toFixed(1) + 'px');
      hero.style.setProperty('--r', Math.max(0, r).toFixed(1) + 'px');
      requestAnimationFrame(frame);
    }
    // Start closed; the drift (or the cursor) opens it.
    hero.style.setProperty('--r', '0px');
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
