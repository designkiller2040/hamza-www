<!DOCTYPE html>
<!-- Template: the Exhibited page, built to /exhibited/. All exhibitions one under the other, newest first: a photo (880 x 439 at 1512, the homepage hero proportions made smaller so the next one peeks in) with the title left and venue + year right (alona's mockup, 2026-11-14). Each block opens the exhibition's own page. The list comes from content/exhibitions/*.json (admin Exhibitions tab). Menu and credits come from src/partials/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Exhibited — {{name}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="home2 exhibited-page">
{{> menu}}

  <main class="exd">
    <h1 class="visually-hidden">Exhibited</h1>

{{{exhibited.items}}}
  </main>

  <!-- Hover: the normal pointing-hand cursor (the "See more" tag was removed, alona 2026-11-16). -->

{{> credits}}
</body>
</html>
