<!DOCTYPE html>
<!-- Template: the Works page, built to /works/. The works grid is the one that used to sit on the homepage (content/home2.json, edited in the admin Works tab). Menu and credits come from src/partials/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Works — {{name}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="home2 home-page works-page">
{{> menu}}

  <main>
    <section id="works" class="h2-works">
      <h1 class="visually-hidden">Works</h1>
{{{home2.worksPage}}}
    </section>
  </main>
  <noscript><style>.w2-pic.wait img { opacity: 1; }</style></noscript>
  <script>
    // Each painting starts as its tiny blurred preview and fades in once loaded.
    document.querySelectorAll('.w2-pic.wait img').forEach(function (img) {
      var done = function () { img.parentNode.classList.remove('wait'); };
      if (img.complete && img.naturalWidth) { img.style.transition = 'none'; done(); }
      else { img.addEventListener('load', done); img.addEventListener('error', done); }
    });
  </script>

{{> vilna-end}}
{{> credits}}
</body>
</html>
