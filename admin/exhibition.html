<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Exhibition page · Hamza Shah admin</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="tabs.css">
<link rel="stylesheet" href="admin.css">
<script src="gh.js"></script>
<script src="admin.js" defer></script>
<script src="exhibition.js" defer></script>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="topbar-left">
    <a class="brand hide-phone" href="home.html">Hamza Shah Mian</a>
    <span class="divider hide-phone"></span>
    <nav class="tabs" aria-label="Content"><a class="tab" href="home.html"><span>Home</span></a><a class="tab" href="works.html"><span>Works</span></a><a class="tab" href="exhibitions.html" aria-current="page"><span class="tab-pill"></span><span>Exhibited</span></a><a class="tab" href="about.html"><span>About</span></a></nav>
    <span id="status" class="status" hidden></span>
  </div>
  <div class="topbar-right">
    <span id="save-state" class="save-state" aria-live="polite"></span>
    <a class="btn view-page" id="view" href="../exhibited/" target="_blank" rel="noopener" aria-label="View page"><span class="label">View page</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a>
    <button class="btn dark" id="save" type="button" disabled>Save</button>
  </div>
</div></header>
<div id="loader" class="loader" aria-live="polite"><div class="loader-in"><div class="loader-name"><img class="logo" src="logo.svg" alt="Vilna" width="90" height="63"></div><div class="loader-text">Loading<span class="dots"><i>.</i><i>.</i><i>.</i></span></div></div></div>
<main class="page" id="main">
  <!-- One exhibition's own page ("Edit page info" on the Exhibited tab, alona 2026-11-16). -->
  <div class="ep-head">
    <a class="ep-back" href="exhibitions.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>All exhibitions</a>
    <h1 class="item-name" id="item-name">&nbsp;</h1>
    <p class="hint" id="ep-hint"></p>
  </div>
  <div class="ex-grid ep-grid">
    <div><span class="lbl-main">Main photo</span><div class="ex-photo"><div class="drop" id="drop"></div><div class="image-meta" id="drop-meta"></div></div><p class="hint" id="main-hint"></p></div>
    <div class="fields" id="texts"></div>
  </div>
  <section class="ep-more">
    <span class="lbl-main">More photos</span>
    <div class="ex-photos ep-photos" id="photos"></div>
    <p class="hint" id="photos-hint"></p>
  </section>
</main>
<footer class="admin-foot"><span>Each save goes live on the site about a minute later.</span><a href="#" data-logout>Log out</a></footer>
</body>
</html>
