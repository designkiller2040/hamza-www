  <!-- Homepage only (alona 2026-11-16): the bottom credits are hidden when
       the page opens and fade in once you scroll (wheel, swipe, scroll or
       arrow keys). Without JavaScript they simply stay visible. -->
  <script>
  (function () {
    var root = document.documentElement;
    root.classList.add('credits-wait');
    function show() {
      root.classList.remove('credits-wait');
      ['wheel', 'touchmove', 'scroll', 'keydown'].forEach(function (t) {
        window.removeEventListener(t, show);
      });
    }
    ['wheel', 'touchmove', 'scroll', 'keydown'].forEach(function (t) {
      window.addEventListener(t, show, { passive: true });
    });
  })();
  </script>
