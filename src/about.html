<!DOCTYPE html>
<!-- Template: the About page, built to /about/. Layout follows alona's design (2026-11-13), drawn on a 1512 px wide page. Text comes from content/about.json. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{{name}} — About</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="home2 about2">
{{> menu}}

  <!-- About page, alona's design 2026-11-13: the About section that was on
       the homepage (quote top left, bio bottom left, portrait right), then
       Studies / Solo shows, then Media. Contacts sit under the portrait. -->
  <main class="abt">
    <h1 class="visually-hidden">About {{name}}</h1>
    <div class="abt-top">
      <div class="abt-text">
        <blockquote class="abt-quote">{{{about.quoteLines}}}</blockquote>
        <div class="abt-bio">
{{{about.bio}}}
        </div>
      </div>
      <div class="abt-right">
        <figure class="abt-photo">
          <img src="{{root}}{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
        </figure>
        <!-- Contacts sit under the portrait, as wide as it (alona 2026-11-14) -->
        <div class="abt-contacts">
          <h2 class="abt-label">{{about.contactsLabel}}</h2>
          <div class="abt-list abt-links">
  {{{about.links}}}
          </div>
        </div>
      </div>
    </div>

    <div class="abt-cv">
      <div class="abt-solo">
        <h2 class="abt-label">{{about.soloShowsLabel}}</h2>
        <div class="abt-list">
{{{about.soloShows}}}
        </div>
      </div>
      <div class="abt-studies">
        <h2 class="abt-label">{{about.studiesLabel}}</h2>
        <div class="abt-list abt-justify">
{{{about.studies}}}
        </div>
      </div>
    </div>

    <div class="abt-media">
      <h2 class="abt-label">{{about.mediaLabel}}</h2>
      <div class="abt-media-grid">
{{{about.media}}}
      </div>
    </div>
  </main>

{{> vilna-end}}
{{> credits}}
  <script>
  /* Media cards: each card takes the average colour of the bottom strip of
     its photo, so the blurred fade runs into a matching background. Works
     for any card added later; dark text on very light photos. */
  (function () {
    function tint(card) {
      var img = card.querySelector('img');
      if (!img) return;
      function run() {
        try {
          var w = 48, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var x = c.getContext('2d', { willReadFrequently: true });
          x.drawImage(img, 0, 0, w, h);
          var rows = Math.max(1, Math.round(h * 0.08));
          var d = x.getImageData(0, h - rows, w, rows).data, r = 0, g = 0, b = 0, n = d.length / 4;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
          r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
          card.style.setProperty('--bg', 'rgb(' + r + ',' + g + ',' + b + ')');
          card.classList.toggle('is-light', (0.299 * r + 0.587 * g + 0.114 * b) > 170);
        } catch (e) {}
      }
      if (img.complete && img.naturalWidth) run(); else img.addEventListener('load', run);
    }
    document.querySelectorAll('.abt-card').forEach(tint);
  })();
  </script>
</body>
</html>
