<!DOCTYPE html>
<!-- Template: the build script (build.mjs) fills the {{...}} parts from the files in content/. Edit text in the admin (/admin/) or in content/, not here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
{{> header}}

  <!-- Hero: the photos crossfade one into the next as you scroll, with their captions -->
  <div class="hero-scroll" style="--slides:{{hero.count}}">
    <figure class="hero">
      <div class="hero-frame">
{{{hero.images}}}
      </div>
      <div class="hero-captions">
{{{hero.captions}}}
      </div>
    </figure>
  </div>

  <main>
    <section id="about" class="about">
      <h2 class="about-label">About</h2>
      <figure class="about-photo">
        <img src="{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
      </figure>
      <p class="about-caption">{{{about.caption}}}</p>
      <div class="about-text">
        <blockquote>
          {{about.quote}}
        </blockquote>
        <div class="bio">
{{{about.bio}}}
        </div>
      </div>
    </section>

    <section id="exhibitions" class="exhibitions">
      <h2>Exhibitions</h2>
      <div class="exhibition-list">
{{{exhibitions}}}
      </div>
    </section>
    <!-- TODO: press, videos and interviews -->
    <section id="media" class="media">
      <h2>Media</h2>
    </section>
  </main>

{{> footer}}
  <script>
  // Hero slideshow: while the page is at the top, each scroll (wheel, swipe or
  // arrow key) fades to the next photo and caption. After the last photo the
  // page scrolls on as normal; scrolling back up at the top steps back.
  (function () {
    var wrap = document.querySelector('.hero-scroll');
    if (!wrap) return;
    var imgs = wrap.querySelectorAll('.hero-frame img');
    var caps = wrap.querySelectorAll('.hero-captions figcaption');
    var n = imgs.length;
    if (n < 2) return;
    var root = document.documentElement;
    root.classList.add('hero-js');
    var header = document.querySelector('.site-header');
    var idx = 0, lockedAt = 0, lastEvent = 0;
    var FADE = 900;

    function setHeader() { root.style.setProperty('--header-h', header.offsetHeight + 'px'); }
    function show(k) {
      idx = k;
      for (var i = 0; i < n; i++) {
        // Photos up to the current one stay visible underneath, so a fade
        // always goes photo-to-photo, never through white.
        imgs[i].style.opacity = i <= idx ? 1 : 0;
        caps[i].classList.toggle('is-active', i === idx);
        caps[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
        imgs[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
      }
    }
    function atTop() { return window.scrollY <= 2; }
    function canStep(dir) { return atTop() && (dir > 0 ? idx < n - 1 : idx > 0); }
    function busy(now) { return now - lockedAt < FADE || now - lastEvent < 120; }
    // Returns true when the event was used to change the photo (or swallowed
    // while a change is still running).
    function step(dir) {
      var now = Date.now();
      var wasBusy = busy(now);
      lastEvent = now;
      // Hold the page still until the current gesture has ended, so one
      // trackpad swipe moves one photo and doesn't run on into the page.
      if (atTop() && wasBusy) return true;
      if (!canStep(dir)) return false;
      lockedAt = now;
      show(idx + dir);
      return true;
    }

    window.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) < 2) return;
      if (step(e.deltaY > 0 ? 1 : -1)) e.preventDefault();
    }, { passive: false });

    var startY = null, swiped = false;
    window.addEventListener('touchstart', function (e) {
      startY = e.touches[0].clientY; swiped = false;
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      var dy = startY - e.touches[0].clientY;
      var dir = dy > 0 ? 1 : -1;
      if (!canStep(dir)) return;
      e.preventDefault();
      if (!swiped && Math.abs(dy) > 30) { swiped = true; lastEvent = 0; step(dir); }
    }, { passive: false });
    window.addEventListener('touchend', function () { startY = null; }, { passive: true });

    window.addEventListener('keydown', function (e) {
      var dir = { ArrowDown: 1, PageDown: 1, ' ': 1, ArrowUp: -1, PageUp: -1 }[e.key];
      if (!dir || e.target.closest('input, textarea, select, button, a')) return;
      lastEvent = 0;
      if (step(dir)) e.preventDefault();
    });

    setHeader(); show(0);
    window.addEventListener('resize', setHeader);
  })();
  </script>
</body>
</html>
