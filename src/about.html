<!DOCTYPE html>
<!-- Template: the About page, built to /about/. Layout follows alona's design (2026-11-13), drawn on a 1512 px wide page. Text comes from content/about.json. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>About — {{name}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="home2 about2">
{{> menu}}

  <!-- About page, alona's design 2026-11-13: the About section that was on
       the homepage (quote top left, bio bottom left, portrait right), then
       Studies / Solo shows, then Media. Contacts sit under the portrait. -->
  <main class="abt">
    <h1 class="visually-hidden">About {{name}}</h1>
    <div class="abt-top">
      <div class="abt-text">
        <blockquote class="abt-quote">{{{about.quoteLines}}}</blockquote>
        <div class="abt-bio">
{{{about.bio}}}
        </div>
      </div>
      <div class="abt-right">
        <figure class="abt-photo">
          <img src="{{root}}{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
        </figure>
        <!-- Contacts sit under the portrait, as wide as it (alona 2026-11-14) -->
        <div class="abt-contacts">
          <h2 class="abt-label">{{about.contactsLabel}}</h2>
          <div class="abt-list abt-links">
  {{{about.links}}}
          </div>
        </div>
      </div>
    </div>

    <div class="abt-cv">
      <div class="abt-solo">
        <h2 class="abt-label">{{about.soloShowsLabel}}</h2>
        <div class="abt-list">
{{{about.soloShows}}}
        </div>
      </div>
      <div class="abt-studies">
        <h2 class="abt-label">{{about.studiesLabel}}</h2>
        <div class="abt-list abt-justify">
{{{about.studies}}}
        </div>
      </div>
    </div>

    <div class="abt-media">
      <h2 class="abt-label">{{about.mediaLabel}}</h2>
      <div class="abt-media-grid">
{{{about.media}}}
      </div>
    </div>
    <noscript><style>.abt-card-pic.wait img { opacity: 1; }</style></noscript>
  <script>
    // Press photos start as a tiny blurred preview and fade in once loaded.
    document.querySelectorAll('.abt-card-pic.wait img').forEach(function (img) {
      var done = function () { img.parentNode.classList.remove('wait'); };
      if (img.complete && img.naturalWidth) { img.style.transition = 'none'; done(); }
      else { img.addEventListener('load', done); img.addEventListener('error', done); }
    });
  </script>
</main>

{{> credits}}
</body>
</html>
