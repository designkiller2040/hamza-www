<!DOCTYPE html>
<!-- Template: the About page, built to /about/. Layout follows alona's design (2026-11-07), drawn on a 1512 px wide page. Text comes from content/about.json. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}} — About</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="home2 about2">
  <header class="h2-header">
    <nav class="h2-nav">
      <a href="{{root}}#works">Works</a>
      <a href="{{root}}regards-croises/">Exhibited</a>
      <a href="{{root}}about/" aria-current="page">About</a>
    </nav>
  </header>

  <main class="ab">
    <h1 class="visually-hidden">About {{name}}</h1>
    <blockquote class="ab-quote">{{about.quote}}</blockquote>

    <figure class="ab-photo">
      <img src="{{root}}{{aboutPage.src}}" alt="{{aboutPage.alt}}" width="{{aboutPage.width}}" height="{{aboutPage.height}}">
    </figure>

    <!-- Beside the photo: bio at the top, ig and email at the bottom, level with the photo's bottom edge -->
    <div class="ab-side">
      <div class="ab-bio">
{{{about.bio}}}
      </div>

      <p class="ab-links">
{{{about.links}}}
      </p>
    </div>

    <!-- Under the photo: Studies, then Solo shows (the list Hamza keeps adding to) -->
    <div class="ab-cv">
      <div class="ab-block ab-studies">
        <h2 class="ab-label">{{about.studiesLabel}}</h2>
        <div class="ab-list">
{{{about.studies}}}
        </div>
      </div>
      <div class="ab-block ab-solo">
        <h2 class="ab-label">{{about.soloShowsLabel}}</h2>
        <div class="ab-list">
{{{about.soloShows}}}
        </div>
      </div>
    </div>

    <div class="ab-media">
      <h2 class="ab-label">{{about.mediaLabel}}</h2>
      <div class="ab-media-grid">
{{{about.media}}}
      </div>
    </div>
  </main>

{{> credits}}
</body>
</html>
