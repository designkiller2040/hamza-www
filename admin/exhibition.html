<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Exhibition page · Hamza Shah admin</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="tabs.css">
<link rel="stylesheet" href="admin.css">
<script src="gh.js"></script>
<script src="admin.js" defer></script>
<script src="exhibition.js" defer></script>
</head>
<body>
<header class="topbar ep-top"><div class="topbar-in">
  <!-- alona's design (2026-11-17): back arrow, Exhibitions | page name, Preview page, Save & Publish. -->
  <div class="topbar-left">
    <a class="ep-back" href="exhibitions.html" aria-label="Back to exhibitions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <a class="ep-crumb" href="exhibitions.html">Exhibitions</a>
    <span class="ep-sep" aria-hidden="true">|</span>
    <h1 class="ep-name" id="item-name">&nbsp;</h1>
    <span id="status" class="status" hidden></span>
  </div>
  <div class="topbar-right">
    <span id="save-state" class="save-state" aria-live="polite"></span>
    <button class="btn" id="preview" type="button">Preview page</button>
    <button class="btn dark" id="save" type="button" disabled>Save &amp; Publish</button>
  </div>
</div></header>
<div id="loader" class="loader" aria-live="polite"><div class="loader-in"><div class="loader-name"><img class="logo" src="logo.svg" alt="Vilna" width="90" height="63"></div><div class="loader-text">Loading<span class="dots"><i>.</i><i>.</i><i>.</i></span></div></div></div>
<main class="page ep-page" id="main">
  <p class="hint ep-hint" id="ep-hint" hidden></p>
  <div class="ep-grid">
    <div class="fields" id="head-fields">
      <div><label class="lbl" for="title">Title</label><input class="field" id="title" type="text" placeholder="e.g. New exhibition" autocomplete="off"><p class="hint">The „quotes“ are added on the site.</p></div>
      <div><label class="lbl" for="place">Place and year</label><input class="field" id="place" type="text" placeholder="e.g. St. Elisabeth, Berlin 2026" autocomplete="off"></div>
    </div>
    <div class="ep-main"><span class="ep-main-lbl">Main image</span><div class="drop" id="drop"></div><div class="image-meta" id="drop-meta"></div></div>
  </div>
  <div class="ep-cols" id="cols"></div>
  <div class="fields ep-texts" id="texts" hidden></div>
  <section class="ep-more">
    <button class="ep-add" type="button" id="add-images"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg><span>Add images</span></button>
    <p class="hint" id="photos-hint"></p>
    <div class="ep-photos" id="photos"></div>
  </section>
</main>
<footer class="admin-foot"><span>Each save goes live on the site about a minute later.</span><a href="#" data-logout>Log out</a></footer>
</body>
</html>
