<!DOCTYPE html>
<!-- Template: the build script (build.mjs) fills the {{...}} parts from the files in content/. Edit text in the admin (/admin/) or in content/, not here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home2">
  <!-- Home #2 (alona's design, 2026-11-06). Home #1 is kept at /home-1/. -->
  <header class="h2-header" id="home">
    <nav class="h2-nav">
      <a href="#works">Works</a>
      <a href="abimal/">Exhibited</a>
      <a href="about/">About</a>
    </nav>
  </header>

  <!-- Hero: one scroll changes the photo and its caption underneath -->
  <div class="hero-scroll h2-slides" style="--slides:{{hero.count}}">
    <figure class="hero">
      <div class="hero-frame">
{{{hero.images}}}
      </div>
      <div class="hero-captions">
{{{hero.captions}}}
      </div>
    </figure>
  </div>

  <div class="h2-credits">
    <p class="h2-signature">Hamza Shah Mian @2027</p>
    <p class="h2-studio"><img src="images/vilna-logo.svg" alt="Vilna" width="90" height="63"><span>digital art direction</span></p>
  </div>

  <main>
    <section id="about" class="about">
      <h2 class="about-label">About</h2>
      <figure class="about-photo">
        <img src="{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
      </figure>
      <p class="about-caption">{{{about.caption}}}</p>
      <div class="about-text">
        <blockquote>
          {{about.quote}}
        </blockquote>
        <div class="bio">
{{{about.bio}}}
        </div>
      </div>
    </section>

    <section id="works" class="h2-works">
      <h2 class="visually-hidden">Works</h2>
{{{home2.works}}}
    </section>


  </main>

  <script>
  // Hero slideshow, driven by normal page scrolling (nothing is blocked, so
  // it can never get stuck): the photo stays pinned while you scroll through
  // a short stretch of page, and each stretch fades in the next photo and
  // caption. After the last photo the page carries on to the works.
  (function () {
    var wrap = document.querySelector('.hero-scroll');
    if (!wrap) return;
    var imgs = wrap.querySelectorAll('.hero-frame img');
    var caps = wrap.querySelectorAll('[data-slide]');
    var n = imgs.length;
    if (n < 2) return;
    document.documentElement.classList.add('hero-js');
    var idx = -1;

    function show(k) {
      if (k === idx) return;
      idx = k;
      for (var i = 0; i < n; i++) {
        // Photos up to the current one stay visible underneath, so a fade
        // always goes photo-to-photo, never through white.
        imgs[i].style.opacity = i <= idx ? 1 : 0;
        imgs[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
      }
      for (var c = 0; c < caps.length; c++) {
        var on = Number(caps[c].getAttribute('data-slide')) === idx;
        caps[c].classList.toggle('is-active', on);
        caps[c].setAttribute('aria-hidden', on ? 'false' : 'true');
      }
    }
    function update() {
      // One photo per stretch of scrolling (--step, half a screen).
      var step = window.innerHeight * 0.5;
      var into = -wrap.getBoundingClientRect().top;
      var k = Math.floor((into + step * 0.5) / step);
      show(Math.max(0, Math.min(n - 1, k)));
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();
  </script>
</body>
</html>
