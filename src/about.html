<!DOCTYPE html>
<!-- Template: the About page, built to /about/. Layout follows alona's design (2026-11-13), drawn on a 1512 px wide page. Text comes from content/about.json. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}} — About</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="{{root}}fonts/fonts.css">
  <link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="home2 about2">
{{> menu}}

  <!-- About page, alona's design 2026-11-13: the About section that was on
       the homepage (quote top left, bio bottom left, portrait right), then
       Solo shows / Studies / Contacts in a row, then Media. -->
  <main class="abt">
    <h1 class="visually-hidden">About {{name}}</h1>
    <div class="abt-top">
      <div class="abt-text">
        <blockquote class="abt-quote">{{about.quote}}</blockquote>
        <div class="abt-bio">
{{{about.bio}}}
        </div>
      </div>
      <figure class="abt-photo">
        <img src="{{root}}{{portrait.src}}" alt="{{portrait.alt}}" width="{{portrait.width}}" height="{{portrait.height}}">
      </figure>
    </div>

    <div class="abt-cv">
      <div class="abt-solo">
        <h2 class="abt-label">{{about.soloShowsLabel}}</h2>
        <div class="abt-list">
{{{about.soloShows}}}
        </div>
      </div>
      <div class="abt-studies">
        <h2 class="abt-label">{{about.studiesLabel}}</h2>
        <div class="abt-list abt-justify">
{{{about.studies}}}
        </div>
      </div>
      <div class="abt-contacts">
        <h2 class="abt-label">{{about.contactsLabel}}</h2>
        <div class="abt-list abt-links">
{{{about.links}}}
        </div>
      </div>
    </div>

    <div class="abt-media">
      <h2 class="abt-label">{{about.mediaLabel}}</h2>
      <div class="abt-media-grid">
{{{about.media}}}
      </div>
    </div>
  </main>

{{> credits}}
</body>
</html>
