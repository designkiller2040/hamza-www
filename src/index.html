<!DOCTYPE html>
<!-- Template: the build script (build.mjs) fills the {{...}} parts from the files in content/. Edit text in the admin (/admin/) or in content/, not here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home2 home-page">
  <!-- Home #2 (alona's design, 2026-11-06). Home #1 is kept at /home-1/. -->
{{> menu}}

  <!-- Hero: one scroll changes the photo and its caption underneath -->
  <div class="hero-scroll h2-slides" style="--slides:{{hero.count}}">
    <figure class="hero">
      <div class="hero-frame">
{{{hero.images}}}
      </div>
      <div class="hero-captions">
{{{hero.captions}}}
      </div>
    </figure>
  </div>

{{> credits}}

  <main>
    <p class="h2-legal"><a href="lens/">Look closer</a></p>


  </main>

  <script>
  // Hero slideshow, driven by normal page scrolling (nothing is blocked, so
  // it can never get stuck): the photo stays pinned while you scroll through
  // a short stretch of page, and each stretch fades in the next photo and
  // caption. After the last photo the page ends.
  (function () {
    var wrap = document.querySelector('.hero-scroll');
    if (!wrap) return;
    var imgs = wrap.querySelectorAll('.hero-frame img');
    var caps = wrap.querySelectorAll('[data-slide]');
    var n = imgs.length;
    if (n < 2) return;
    document.documentElement.classList.add('hero-js');
    var idx = -1;

    function show(k) {
      if (k === idx) return;
      idx = k;
      for (var i = 0; i < n; i++) {
        // Photos up to the current one stay visible underneath, so a fade
        // always goes photo-to-photo, never through white.
        imgs[i].style.opacity = i <= idx ? 1 : 0;
        imgs[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
      }
      for (var c = 0; c < caps.length; c++) {
        var on = Number(caps[c].getAttribute('data-slide')) === idx;
        caps[c].classList.toggle('is-active', on);
        caps[c].setAttribute('aria-hidden', on ? 'false' : 'true');
      }
    }
    function update() {
      // One photo per stretch of scrolling (--step, half a screen).
      var step = window.innerHeight * 0.5;
      var into = -wrap.getBoundingClientRect().top;
      var k = Math.floor((into + step * 0.5) / step);
      show(Math.max(0, Math.min(n - 1, k)));
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();
  </script>
</body>
</html>
