<!DOCTYPE html>
<!-- Template: the build script (build.mjs) fills the {{...}} parts from the files in content/. Edit text in the admin (/admin/) or in content/, not here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home2 home-page">
  <!-- Home #2 (alona's design, 2026-11-06). Home #1 is kept at /home-1/. -->
{{> menu}}

  <!-- Hero: the photos change on their own every 5 seconds (no captions shown) -->
  <div class="hero-scroll h2-slides" style="--slides:{{hero.count}}">
    <figure class="hero">
      <div class="hero-frame">
{{{hero.images}}}
      </div>
      <div class="hero-captions">
{{{hero.captions}}}
      </div>
    </figure>
  </div>

{{> credits}}
{{> credits-on-scroll}}

  <main>


  </main>

  <script>
  // Phones (alona 2026-11-16): the credits sit under the photo (not on it);
  // the page scrolls a little to show them. See the end of style.css.

  // Hero slideshow (alona 2026-11-16): the photos change on their own every
  // 5 seconds (instant swap, no fade), scrolling does nothing. It pauses while the
  // tab is in the background. No captions on the homepage.
  (function () {
    var wrap = document.querySelector('.hero-scroll');
    if (!wrap) return;
    var imgs = wrap.querySelectorAll('.hero-frame > img');
    var frame = wrap.querySelector('.hero-frame');
    var n = imgs.length;
    if (!n) return;
    document.documentElement.classList.add('hero-js');
    var idx = -1;
    var DELAY = {{home.slideMs}}; // admin Home tab: "Change photo every … seconds"

    function show(k) {
      if (k === idx) return;
      // Back to the first photo: the ones in between are hidden at once
      // (they sit under the last photo anyway), so only the last one fades.
      if (k === 0 && idx > 0) {
        for (var j = 1; j < idx; j++) {
          imgs[j].style.transition = 'none';
          imgs[j].style.opacity = 0;
          void imgs[j].offsetWidth;
          imgs[j].style.transition = '';
        }
      }
      idx = k;
      for (var i = 0; i < n; i++) {
        // Photos up to the current one stay visible underneath, so a fade
        // always goes photo-to-photo, never through white.
        imgs[i].style.opacity = i <= idx ? 1 : 0;
        imgs[i].setAttribute('aria-hidden', i === idx ? 'false' : 'true');
      }
      setTone();
    }
    // Phones: the credits on the photo turn dark over a light photo bottom
    // and stay white over a dark one. Measured from each photo's bottom strip.
    function tone(img) {
      if (img.dataset.tone) return img.dataset.tone;
      if (!img.complete || !img.naturalWidth) return '';
      try {
        var c = document.createElement('canvas');
        c.width = 24; c.height = 8;
        var g = c.getContext('2d');
        var h = img.naturalHeight;
        g.drawImage(img, img.naturalWidth * 0.25, h * 0.8, img.naturalWidth * 0.5, h * 0.2, 0, 0, 24, 8);
        var d = g.getImageData(0, 0, 24, 8).data, sum = 0;
        for (var i = 0; i < d.length; i += 4) sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
        img.dataset.tone = sum / (d.length / 4) > 130 ? 'light' : 'dark';
      } catch (e) { img.dataset.tone = 'dark'; }
      return img.dataset.tone;
    }
    function setTone() {
      if (idx < 0 || !frame) return;
      frame.classList.toggle('tone-light', tone(imgs[idx]) === 'light');
    }
    for (var t = 0; t < n; t++) imgs[t].addEventListener('load', setTone);

    var timer = null;
    // Only one photo (alona 2026-11-16): it just stays. More can be added
    // in the admin (Home > More photos) and then it plays again.
    function start() {
      if (timer || document.hidden || n < 2) return;
      timer = setInterval(function () { show((idx + 1) % n); }, DELAY);
    }
    function stop() { clearInterval(timer); timer = null; }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop(); else start();
    });
    show(0);
    start();
  })();
  </script>
</body>
</html>
